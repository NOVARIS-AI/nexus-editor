name: NEXUS Editor build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check the internal speech API
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck --types node api/transcribe.ts
      - name: Type-check public creator SEO endpoints
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck api/creator-page.ts api/sitemap.ts
      - name: Verify SEO and brand assets
        run: npm run verify:release
      - name: Run regression tests
        run: npm test
      - name: Type-check and build
        run: npm run build
