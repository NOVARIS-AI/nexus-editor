name: NEXUS Editor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-editor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Regression tests, type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - name: Generate dependency security audit report
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=commonjs -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('npm-audit-report.json','utf8'));const v=a.vulnerabilities||{};console.log('Dependency audit totals:',JSON.stringify(a.metadata?.vulnerabilities||{}));for(const [name,item] of Object.entries(v)){console.log(name+' | '+item.severity+' | direct='+item.isDirect+' | fix='+JSON.stringify(item.fixAvailable));for(const adv of item.via||[]){if(typeof adv==='object')console.log('  '+adv.title+' ('+(adv.range||'range unavailable')+')');}}"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-dependency-audit
          path: npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Check server and Worker JavaScript syntax
        run: |
          for file in api/*.js; do node --check "$file"; done
          node --check workers/nexus-ai/src/index.js
      - name: Type-check the internal speech API
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck --types node api/transcribe.ts
      - name: Type-check public creator SEO endpoints
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck api/creator-page.ts api/sitemap.ts
      - name: Type-check moderation API endpoints
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck --types node api/moderation/*.ts server/moderation-api.ts server/social-api.ts
      - name: Verify SEO and brand assets
        run: npm run verify:release
      - name: Run regression tests
        run: npm test
      - name: Type-check and build
        run: npm run build
