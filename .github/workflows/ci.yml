name: NEXUS Editor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-editor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Regression tests, type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server and Worker JavaScript syntax
        run: |
          for file in api/*.js; do node --check "$file"; done
          node --check workers/nexus-ai/src/index.js
      - name: Run regression tests
        run: npm test
      - name: Type-check and build
        run: npm run build
