name: Cloudflare NEXUS Studio Deploy (no lockfile cache)

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/nexus-app/**"
      - "api/**"
      - "server/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/cloudflare-nexus-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Keep oversized ONNX runtime binary external
        shell: bash
        run: |
          set -euo pipefail
          # visual-brain.ts loads ONNX runtime files from the pinned jsDelivr
          # package URL. Exclude only the >25 MiB threaded asyncify variant
          # that Cloudflare Workers static assets cannot accept.
          find dist -type f -name 'ort-wasm-simd-threaded.asyncify-*.wasm' -print -delete
          while IFS= read -r wasm_file; do
            size=$(stat -c%s "$wasm_file")
            if [ "$size" -gt 25000000 ]; then
              echo "::error::Unexpected oversized WebAssembly asset: $wasm_file ($size bytes)"
              exit 1
            fi
          done < <(find dist -type f -name '*.wasm' -print)
      - name: Deploy Cloudflare Worker and static assets
        working-directory: cloudflare/nexus-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
