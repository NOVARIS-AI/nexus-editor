name: Cloudflare NEXUS Studio Deploy (no lockfile cache)

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/nexus-app/**"
      - "api/**"
      - "server/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/cloudflare-nexus-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Optimize oversized WebAssembly assets for Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r wasm_file; do
            size=$(stat -c%s "$wasm_file")
            if [ "$size" -gt 25000000 ]; then
              echo "Optimizing $wasm_file ($size bytes)"
              npx --yes --package=binaryen wasm-opt "$wasm_file" -Oz --all-features -o "$wasm_file.optimized"
              optimized_size=$(stat -c%s "$wasm_file.optimized")
              echo "Optimized size: $optimized_size bytes"
              if [ "$optimized_size" -ge 25000000 ]; then
                echo "::error::WebAssembly asset remains above Cloudflare's 25 MiB limit after optimization."
                exit 1
              fi
              mv "$wasm_file.optimized" "$wasm_file"
            fi
          done < <(find dist -type f -name '*.wasm' -print)
      - name: Deploy Cloudflare Worker and static assets
        working-directory: cloudflare/nexus-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
