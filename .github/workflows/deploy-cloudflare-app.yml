name: Deploy NEXUS Studio to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "server/**"
      - "public/**"
      - "cloudflare/nexus-app/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - ".github/workflows/deploy-cloudflare-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deployment credentials
        id: preflight
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: npm install

      - name: Build NEXUS Studio
        if: steps.preflight.outputs.ready == 'true'
        run: npm run build

      - name: Optimize oversized WebAssembly assets for Cloudflare
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r wasm_file; do
            size=$(stat -c%s "$wasm_file")
            if [ "$size" -gt 25000000 ]; then
              echo "Optimizing $wasm_file ($size bytes)"
              npx --yes --package=binaryen wasm-opt "$wasm_file" -Oz --all-features -o "$wasm_file.optimized"
              optimized_size=$(stat -c%s "$wasm_file.optimized")
              echo "Optimized size: $optimized_size bytes"
              if [ "$optimized_size" -ge 25000000 ]; then
                echo "::error::WebAssembly asset remains above Cloudflare's 25 MiB limit after optimization."
                exit 1
              fi
              mv "$wasm_file.optimized" "$wasm_file"
            fi
          done < <(find dist -type f -name '*.wasm' -print)

      - name: Deploy app, API and static assets as one Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cloudflare/nexus-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
