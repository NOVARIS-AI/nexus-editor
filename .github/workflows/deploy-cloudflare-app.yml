name: Deploy NEXUS Studio to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "server/**"
      - "public/**"
      - "cloudflare/nexus-app/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - ".github/workflows/deploy-cloudflare-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deployment credentials
        id: preflight
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: npm install

      - name: Build NEXUS Studio
        if: steps.preflight.outputs.ready == 'true'
        run: npm run build

      - name: Deploy app, API and static assets as one Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cloudflare/nexus-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
