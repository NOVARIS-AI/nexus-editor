name: NEXUS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"\n      - "native-engine-plugin/**"\n      - "docs/ANDROID_APK.md"
      - "package.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  CI: true

jobs:
  build-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web editor
        run: npm run build
      - name: Generate Android project and sync native plugins
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-studio-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
