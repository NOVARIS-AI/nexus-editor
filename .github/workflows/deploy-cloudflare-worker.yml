name: NEXUS Cloudflare AI Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/nexus-ai/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check deployment secrets
        id: preflight
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_TOKEN: ${{ secrets.NEXUS_WORKER_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$WORKER_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped safely: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and NEXUS_WORKER_TOKEN."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out source
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        if: steps.preflight.outputs.ready == 'true'
        run: npm install --global wrangler
      - name: Deploy Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: workers/nexus-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
      - name: Set private Worker access token
        if: steps.preflight.outputs.ready == 'true'
        working-directory: workers/nexus-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXUS_WORKER_TOKEN: ${{ secrets.NEXUS_WORKER_TOKEN }}
        run: |
          printf '%s' "$NEXUS_WORKER_TOKEN" | wrangler secret put NEXUS_WORKER_TOKEN
          unset NEXUS_WORKER_TOKEN
