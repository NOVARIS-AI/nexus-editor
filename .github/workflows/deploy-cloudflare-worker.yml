name: NEXUS Cloudflare AI Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/nexus-ai/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check deployment secrets
        id: preflight
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_TOKEN: ${{ secrets.NEXUS_WORKER_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$WORKER_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped safely: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and NEXUS_WORKER_TOKEN."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out source
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        if: steps.preflight.outputs.ready == 'true'
        run: npm install --global wrangler
      - name: Deploy Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: workers/nexus-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
      - name: Set private Worker access token
        if: steps.preflight.outputs.ready == 'true'
        working-directory: workers/nexus-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXUS_WORKER_TOKEN: ${{ secrets.NEXUS_WORKER_TOKEN }}
        run: |
          printf '%s' "$NEXUS_WORKER_TOKEN" | wrangler secret put NEXUS_WORKER_TOKEN
          unset NEXUS_WORKER_TOKEN
      - name: Smoke-test deployed Worker health and authentication
        if: steps.preflight.outputs.ready == 'true'
        env:
          NEXUS_WORKER_TOKEN: ${{ secrets.NEXUS_WORKER_TOKEN }}
        run: |
          set +x
          BASE="https://nexus-studio-ai.schoolershubit5.workers.dev"
          curl --fail --silent --show-error "$BASE/health" -o /tmp/nexus-health.json
          node -e "const h=require('/tmp/nexus-health.json'); if(!h.ok || h.protocol!=='nexus-ai-v1') process.exit(1)"
          UNAUTH_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$BASE/v1/generate" -H 'Content-Type: application/json' --data '{"task":"text","prompt":"health check"}')
          test "$UNAUTH_STATUS" = "401"
          AUTH_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$BASE/v1/generate" -H "Authorization: Bearer $NEXUS_WORKER_TOKEN" -H 'Content-Type: application/json' --data '{"task":"text"}')
          test "$AUTH_STATUS" = "400"
          curl --fail --silent --show-error -X POST "$BASE/v1/generate" -H "Authorization: Bearer $NEXUS_WORKER_TOKEN" -H 'Content-Type: application/json' --data '{"task":"text","prompt":"Reply with the single word READY."}' -o /tmp/nexus-text.json
          node -e "const r=require('/tmp/nexus-text.json'); if(typeof r.response!=='string' || !r.response.trim()) process.exit(1)"
          unset NEXUS_WORKER_TOKEN
          echo "Worker health, bearer-token gate, request validation and live text inference passed."
